version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: prescripto_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: prescripto_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGODB_URI=mongodb://mongodb:27017
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
    container_name: prescripto_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
    container_name: prescripto_admin
    restart: always
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  mongo_data:
